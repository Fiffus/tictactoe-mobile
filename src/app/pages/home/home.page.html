<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Home</ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="center">
    <ion-card>
      <ion-card-content>
        <ion-button class="play-button">
          Play
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
