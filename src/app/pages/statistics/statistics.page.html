<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Statistics</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Statistics</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card class="history-card won">
    <ion-card-content>
      <div class="history-header">
        <h2>Against: Player Name</h2>
        <span class="result-badge won">Won</span>
      </div>
      <div class="history-stats">
        <div class="stat">
          <span class="stat-label">Win ratio</span>
          <span class="stat-value">75%</span>
        </div>
        <div class="stat">
          <span class="stat-label">Games played</span>
          <span class="stat-value">12</span>
        </div>
      </div>
    </ion-card-content>
  </ion-card>
  <ion-card class="history-card lost">
    <ion-card-content>
      <div class="history-header">
        <h2>Against: Player Name</h2>
        <span class="result-badge lost">Lost</span>
      </div>
      <div class="history-stats">
        <div class="stat">
          <span class="stat-label">Win ratio</span>
          <span class="stat-value">75%</span>
        </div>
        <div class="stat">
          <span class="stat-label">Games played</span>
          <span class="stat-value">12</span>
        </div>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
